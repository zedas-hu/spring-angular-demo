<input
  [id]="inputId()"
  [attr.list]="uniqueId"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [required]="required()"
  [value]="value()"
  (input)="onInput($event)"
  (blur)="onBlur()"
/>
<datalist [id]="uniqueId">
    @if (keyList.hasValue()) {
        @for (r of keyList.value(); track r.key) {
            <option [value]="r.value">{{ r.value }}</option>
        }
    }
</datalist>
